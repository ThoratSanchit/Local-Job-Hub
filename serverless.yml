service: local-job-hub

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  logRetentionInDays: 7
  environment:
    NODE_ENV: ${self:provider.stage}

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - aws-sdk
      - pg
      - pg-hstore
      - sqlite3
      - tedious
      - mariadb
    target: node20
    platform: node
    concurrency: 10
  dotenv:
    path: .env

functions:
  api:
    handler: src/lambda.handler
    events:
      - http:
          path: /
          method: any
      - http:
          path: /{proxy+}
          method: any

package:
  individually: true
